[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-ensemble"
version = "0.1.0"
description = "Own knee MRI family code and aggregate research report"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=2.0", "torch>=2.4", "torchvision>=0.19", "timm>=1.0", "safetensors>=0.4", "psutil>=6", "opencv-python-headless>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
